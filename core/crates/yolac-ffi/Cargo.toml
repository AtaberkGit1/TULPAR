[package]
name = "yolac-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Panic-safe Android JNI and C-ABI bindings for TULPAR"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
android-jni = ["dep:jni"]

[dependencies]
tokio.workspace = true
yolac-core = { path = "../yolac-core" }
yolac-net = { path = "../yolac-net" }
jni = { version = "0.21", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
