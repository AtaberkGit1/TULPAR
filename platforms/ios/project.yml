name: Yolac
options:
  bundleIdPrefix: org.yolac
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: "YOLAÇ"
targets:
  YolacApp:
    type: application
    platform: iOS
    sources:
      - path: YolacApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yolac.app
        INFOPLIST_FILE: YolacApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: YolacApp/YolacApp.entitlements
    dependencies:
      - target: YolacTunnel
        embed: true
  YolacTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: YolacTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yolac.app.tunnel
        INFOPLIST_FILE: YolacTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: YolacTunnel/YolacTunnel.entitlements
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../../core/crates/yolac-ffi/include"
        OTHER_LDFLAGS: "-lresolv"
    dependencies:
      - framework: Frameworks/YolacFfi.xcframework
        embed: false
