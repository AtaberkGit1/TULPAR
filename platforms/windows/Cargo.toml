[package]
name = "yolac-windows"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "TULPAR Native Windows Application (Win32 Minimalist UI + System Tray + WinDivert Packet Engine)"

[[bin]]
name = "tulpar"
path = "src/main.rs"

[dependencies]
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
yolac-core = { path = "../../core/crates/yolac-core" }
yolac-dpi = { path = "../../core/crates/yolac-dpi" }
yolac-dns = { path = "../../core/crates/yolac-dns" }
yolac-net = { path = "../../core/crates/yolac-net" }

[dev-dependencies]
yolac-blocklist = { path = "../../core/crates/yolac-blocklist" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
