[package]
name = "yolac-linux"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "TULPAR Zero-Dependency Linux Engine (Pure-Rust Netlink NFQUEUE + Raw Socket DPI Bypass + Transparent Encrypted DNS + Ad-Blocker)"

[[bin]]
name = "tulpar"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
yolac-core = { path = "../../core/crates/yolac-core" }
yolac-dpi = { path = "../../core/crates/yolac-dpi" }
yolac-dns = { path = "../../core/crates/yolac-dns" }
yolac-net = { path = "../../core/crates/yolac-net" }
yolac-blocklist = { path = "../../core/crates/yolac-blocklist" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
