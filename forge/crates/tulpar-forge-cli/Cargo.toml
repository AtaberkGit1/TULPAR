[package]
name = "tulpar-forge-cli"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Developer & operator CLI for developing, testing, verifying, and packaging TULPAR Forge (.tulpar) strategies"

[[bin]]
name = "tulpar-forge"
path = "src/main.rs"

[dependencies]
tulpar-forge = { path = "../tulpar-forge" }
tulpar-forge-lab = { path = "../tulpar-forge-lab" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
