name: TULPAR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test Rust Core Workspace
        working-directory: core
        run: |
          cargo test --workspace
          cargo check -p yolac-ffi --features android-jni
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace --release
      - name: Test & Audit TULPAR Forge Workspace
        working-directory: forge
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo run -p tulpar-forge-cli -- verify-security
          cargo run -p tulpar-forge-cli -- test examples/turkey_balanced.tlp

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build & Test TULPAR Windows (.exe)
        working-directory: platforms/windows
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tulpar-windows-exe
          path: platforms/windows/target/release/tulpar.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build Android Rust JNI & Test + Lint + Assemble APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          CMDLINE_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1)"
          export PATH="${CMDLINE_BIN:-$ANDROID_HOME/cmdline-tools/latest/bin}:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core
          cargo build --release --target aarch64-linux-android -p yolac-ffi --features android-jni
          cargo build --release --target x86_64-linux-android -p yolac-ffi --features android-jni
          mkdir -p ../platforms/android/app/src/main/jniLibs/arm64-v8a ../platforms/android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libyolac_ffi.so ../platforms/android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libyolac_ffi.so ../platforms/android/app/src/main/jniLibs/x86_64/
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TULPAR,O=TULPAR,C=TR"
          fi
          cd ../platforms/android
          gradle testDebugUnitTest lintVitalRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tulpar-android-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test & Build Static TULPAR Linux (x86_64)
        working-directory: platforms/linux
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/tulpar tulpar-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: tulpar-linux-x64
          path: platforms/linux/tulpar-linux-x64
