name: TULPAR Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        default: "v0.5.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TULPAR_GITHUB_REPO: ${{ github.repository }}
  YOLAC_GITHUB_REPO: ${{ github.repository }}

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build & Test TULPAR Windows (.exe + verified WinDivert 2.2.2 .zip)
        shell: pwsh
        env:
          TULPAR_GITHUB_REPO: ${{ github.repository }}
          YOLAC_GITHUB_REPO: ${{ github.repository }}
        run: |
          cd platforms/windows
          Invoke-WebRequest -Uri "https://reqrypt.org/download/WinDivert-2.2.2-A.zip" -OutFile "wd.zip"
          Expand-Archive -Path wd.zip -DestinationPath wd
          $dllHash = (Get-FileHash "wd/WinDivert-2.2.2-A/x64/WinDivert.dll" -Algorithm SHA256).Hash.ToLower()
          $sysHash = (Get-FileHash "wd/WinDivert-2.2.2-A/x64/WinDivert64.sys" -Algorithm SHA256).Hash.ToLower()
          if ($dllHash -ne "c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2") { throw "WinDivert.dll SHA-256 mismatch: $dllHash" }
          if ($sysHash -ne "8da085332782708d8767bcace5327a6ec7283c17cfb85e40b03cd2323a90ddc2") { throw "WinDivert64.sys SHA-256 mismatch: $sysHash" }
          $env:TULPAR_WINDIVERT_DIR = (Resolve-Path "wd/WinDivert-2.2.2-A/x64").Path
          cargo test
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/tulpar.exe dist/tulpar.exe
          Copy-Item target/release/tulpar.exe tulpar.exe
          Copy-Item "wd/WinDivert-2.2.2-A/x64/WinDivert.dll" dist/WinDivert.dll
          Copy-Item "wd/WinDivert-2.2.2-A/x64/WinDivert64.sys" dist/WinDivert64.sys
          Compress-Archive -Path dist/* -DestinationPath tulpar-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            platforms/windows/tulpar.exe
            platforms/windows/tulpar-windows-x64.zip

  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build Android Rust JNI + JUnit Tests + Lint + APK (.apk)
        env:
          TULPAR_GITHUB_REPO: ${{ github.repository }}
          YOLAC_GITHUB_REPO: ${{ github.repository }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          CMDLINE_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1)"
          export PATH="${CMDLINE_BIN:-$ANDROID_HOME/cmdline-tools/latest/bin}:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cd core
          cargo build --release --target aarch64-linux-android -p yolac-ffi --features android-jni
          cargo build --release --target x86_64-linux-android -p yolac-ffi --features android-jni
          mkdir -p ../platforms/android/app/src/main/jniLibs/arm64-v8a ../platforms/android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libyolac_ffi.so ../platforms/android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libyolac_ffi.so ../platforms/android/app/src/main/jniLibs/x86_64/
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TULPAR,O=TULPAR,C=TR"
          fi
          cd ../platforms/android
          gradle testDebugUnitTest lintVitalRelease assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk tulpar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: platforms/android/tulpar.apk

  build-linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Static Zero-Dependency TULPAR Linux (x86_64)
        working-directory: platforms/linux
        env:
          TULPAR_GITHUB_REPO: ${{ github.repository }}
          YOLAC_GITHUB_REPO: ${{ github.repository }}
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/tulpar tulpar-linux-x64
          tar -czf tulpar-linux-x64.tar.gz tulpar-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            platforms/linux/tulpar-linux-x64
            platforms/linux/tulpar-linux-x64.tar.gz

  publish-github-release:
    needs: [build-windows-release, build-android-release, build-linux-release]
    if: ${{ needs.build-windows-release.result == 'success' && needs.build-android-release.result == 'success' && needs.build-linux-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          ls -lh
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish Official GitHub Release (Windows + Android + Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"
          NOTES="GÜVENLİK UYARISI: TULPAR'ı yalnızca resmî GitHub sayfamızdan indirin! İndirdiğiniz dosyaların bütünlüğünü SHA256SUMS.txt ile doğrulayın. Windows'ta doğrudan tulpar.exe veya tulpar-windows-x64.zip, Android'de tulpar.apk, Linux'ta tulpar-linux-x64 dosyasını kullanabilirsiniz."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "TULPAR $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" release-assets/* --repo "$REPO" --title "TULPAR $TAG" --notes "$NOTES"
          fi
